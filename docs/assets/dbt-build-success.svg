<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">dbt build successful reference evidence</title>
  <desc id="desc">Sanitized static reference card showing dbt staging, warehouse and marts build results.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, monospace; }
      .small { font-size: 18px; }
      .body { font-size: 23px; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="636" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="36" y="32" width="1128" height="138" rx="20" fill="url(#header)"/>
  <rect x="36" y="130" width="1128" height="40" fill="url(#header)"/>
  <text x="78" y="84" class="font title" fill="#ffffff">dbt Core · Build and tests</text>
  <text x="78" y="126" class="font body mono" fill="#bfdbfe">ecommerce_dw · prod contract</text>
  <rect x="890" y="68" width="220" height="48" rx="24" fill="#166534"/>
  <circle cx="920" cy="92" r="9" fill="#bbf7d0"/>
  <text x="943" y="100" class="font body" fill="#ffffff">PASSED</text>

  <text x="78" y="218" class="font small" fill="#64748b">COMMAND</text>
  <text x="78" y="254" class="font body mono" fill="#0f172a">dbt build --profiles-dir . --target prod</text>
  <text x="78" y="302" class="font small" fill="#64748b">TARGET SCHEMAS</text>
  <text x="78" y="338" class="font body mono" fill="#0f172a">staging · warehouse · marts</text>

  <rect x="78" y="382" width="1044" height="54" rx="8" fill="#eff6ff"/>
  <text x="104" y="417" class="font label" fill="#1e3a8a">BUILD GRAPH</text>
  <text x="570" y="417" class="font label" fill="#1e3a8a">RESULT</text>
  <text x="1018" y="417" class="font label" text-anchor="end" fill="#1e3a8a">STATUS</text>

  <g class="font body">
    <rect x="78" y="448" width="1044" height="48" rx="8" fill="#f8fafc"/>
    <text x="104" y="480" class="mono" fill="#0f172a">staging views</text>
    <text x="570" y="480" fill="#475569">normalized source models</text>
    <text x="1018" y="480" text-anchor="end" fill="#15803d">PASS</text>

    <rect x="78" y="506" width="1044" height="48" rx="8" fill="#f8fafc"/>
    <text x="104" y="538" class="mono" fill="#0f172a">warehouse tables</text>
    <text x="570" y="538" fill="#475569">dimensions + fct_orders</text>
    <text x="1018" y="538" text-anchor="end" fill="#15803d">PASS</text>

    <rect x="78" y="564" width="1044" height="48" rx="8" fill="#f8fafc"/>
    <text x="104" y="596" class="mono" fill="#0f172a">marts + data tests</text>
    <text x="570" y="596" fill="#475569">daily / customer / product sales</text>
    <text x="1018" y="596" text-anchor="end" fill="#15803d">PASS</text>
  </g>
  <text x="78" y="645" class="font small" fill="#64748b">Generated reference evidence · sanitized · validate again with the local runbook</text>
</svg>
