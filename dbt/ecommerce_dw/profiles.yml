ecommerce_dw:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "127.0.0.1"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('DBT_DB_USER') }}"
      password: "{{ env_var('DBT_DB_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging
      threads: 4
      connect_timeout: 10