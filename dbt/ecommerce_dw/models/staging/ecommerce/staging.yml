version: 2

models:
  - name: stg_categories
    description: >
      Cleaned and standardized category records from raw.categories.
      Grain: one row per category_id.

    columns:
      - name: category_id
        description: Unique source category identifier.
        data_tests:
          - not_null
          - unique

      - name: category_name
        description: Cleaned category name.
        data_tests:
          - not_null

      - name: batch_id
        description: Last ingestion batch associated with the record.
        data_tests:
          - not_null

      - name: is_active
        description: Whether the category is currently active.
        data_tests:
          - not_null

      - name: first_seen_at
        data_tests:
          - not_null

      - name: last_seen_at
        data_tests:
          - not_null


  - name: stg_products
    description: >
      Cleaned and standardized product records from raw.products.
      Grain: one row per product_id.

    columns:
      - name: product_id
        description: Unique source product identifier.
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: product_price
        data_tests:
          - not_null

      - name: category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_categories')
                field: category_id

      - name: image_urls
        data_tests:
          - not_null

      - name: batch_id
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - not_null

      - name: first_seen_at
        data_tests:
          - not_null

      - name: last_seen_at
        data_tests:
          - not_null


  - name: stg_users
    description: >
      Cleaned and standardized ecommerce users.
      Grain: one row per user_id.

    columns:
      - name: user_id
        description: Unique source user identifier.
        data_tests:
          - not_null
          - unique

      - name: email
        description: >
          Normalized user email. It is required but is not treated as a
          unique customer identifier because multiple source users may
          share the same email.
        data_tests:
          - not_null

      - name: user_name
        data_tests:
          - not_null

      - name: batch_id
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - not_null

      - name: first_seen_at
        data_tests:
          - not_null

      - name: last_seen_at
        data_tests:
          - not_null


  - name: stg_orders
    description: >
      Cleaned ecommerce order records.
      Grain: one row per order_id.

    columns:
      - name: order_id
        description: Unique order UUID.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - paid
                  - shipped
                  - delivered
                  - cancelled

      - name: ordered_at
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - USD

      - name: payment_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bank_transfer
                  - cash_on_delivery
                  - credit_card
                  - paypal

      - name: batch_id
        data_tests:
          - not_null

      - name: ingested_at
        data_tests:
          - not_null


  - name: stg_order_items
    description: >
      Cleaned order line records.
      Grain: one row per order_id and line_number.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: line_number
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

      - name: line_amount
        data_tests:
          - not_null

      - name: batch_id
        data_tests:
          - not_null

      - name: ingested_at
        data_tests:
          - not_null