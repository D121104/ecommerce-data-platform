name: Data Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # PostgreSQL container
      POSTGRES_DB: ecommerce_ci
      POSTGRES_ADMIN_USER: platform_admin
      POSTGRES_ADMIN_PASSWORD: ci_admin_password
      POSTGRES_PORT: "5433"

      # Ingestion role
      INGESTION_DB_USER: ingestion_user
      INGESTION_DB_PASSWORD: ci_ingestion_password
      INGESTION_DB_HOST: 127.0.0.1
      INGESTION_DB_PORT: "5433"
      INGESTION_DB_NAME: ecommerce_ci
      INGESTION_DB_CONNECT_TIMEOUT_SECONDS: "10"

      # dbt role
      DBT_DB_USER: dbt_user
      DBT_DB_PASSWORD: ci_dbt_password

      # BI role
      BI_DB_USER: bi_reader
      BI_DB_PASSWORD: ci_bi_password

      # Metabase application database. These are disposable CI credentials.
      METABASE_PORT: "3000"
      METABASE_APP_DB_NAME: metabase_ci
      METABASE_APP_DB_USER: metabase_app
      METABASE_APP_DB_PASSWORD: ci_metabase_app_password

      # Apache Airflow metadata. Disposable values are generated during the
      # workflow and are never committed to the repository or stored as CI secrets.
      AIRFLOW_VERSION: "3.3.0"
      AIRFLOW_UID: "50000"
      AIRFLOW_API_PORT: "8080"
      AIRFLOW_ADMIN_USERNAME: airflow
      AIRFLOW_METADATA_DB_NAME: airflow_ci
      AIRFLOW_METADATA_DB_USER: airflow
      AIRFLOW_ORDERS_PER_RUN: "30"
      AIRFLOW_ORDER_SEED: "42"

      # dbt profile
      DBT_TARGET: dev
      DBT_HOST: 127.0.0.1
      DBT_PORT: "5433"
      DBT_USER: dbt_user
      DBT_PASSWORD: ci_dbt_password
      DBT_DBNAME: ecommerce_ci
      DBT_SCHEMA: dbt_ci
      DBT_SSLMODE: disable

      # Platzi API
      PLATZI_API_BASE_URL: https://api.escuelajs.co/api/v1
      PLATZI_API_PAGE_SIZE: "50"
      PLATZI_API_MAX_PAGES: "100"
      PLATZI_API_CONNECT_TIMEOUT_SECONDS: "5"
      PLATZI_API_READ_TIMEOUT_SECONDS: "30"
      PLATZI_API_WRITE_TIMEOUT_SECONDS: "10"
      PLATZI_API_POOL_TIMEOUT_SECONDS: "5"
      PLATZI_API_MAX_ATTEMPTS: "4"
      PLATZI_API_BACKOFF_SECONDS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Generate ephemeral Airflow secrets
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import secrets

          print(
              "AIRFLOW_FERNET_KEY="
              + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          )
          print("AIRFLOW_JWT_SECRET=" + secrets.token_urlsafe(48))
          print("AIRFLOW_ADMIN_PASSWORD=" + secrets.token_urlsafe(24))
          print("AIRFLOW_METADATA_DB_PASSWORD=" + secrets.token_urlsafe(24))
          PY

      - name: Validate repository and initialization scripts
        run: |
          python scripts/validate_repository.py
          python scripts/security_scan.py
          bash -n sql/init/01_create_roles_and_schemas.sh
          bash -n sql/init/02_create_raw_tables.sh
          bash -n sql/init/03_create_monitoring_objects.sh
          bash -n sql/init/04_create_metabase_app_database.sh
          docker compose config --quiet

      - name: Start PostgreSQL
        run: |
          docker compose up -d --wait || {
            docker compose ps
            docker compose logs postgres airflow-db airflow-init airflow-api-server
            exit 1
          }

      - name: Show PostgreSQL status
        run: docker compose ps

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Run Python tests
        run: pytest -m "not integration"

      - name: Seed deterministic source data
        run: |
          docker compose exec -T postgres \
            psql \
              -U "$POSTGRES_ADMIN_USER" \
              -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 \
            < tests/fixtures/seed_ci.sql

      - name: Validate fixture data
        run: |
          docker compose exec -T postgres \
            psql \
              -U "$POSTGRES_ADMIN_USER" \
              -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  (SELECT COUNT(*) FROM raw.categories) AS categories,
                  (SELECT COUNT(*) FROM raw.products) AS products,
                  (SELECT COUNT(*) FROM raw.users) AS users;
              "

      - name: Generate deterministic orders
        run: |
          generate-orders \
            --business-date 2026-08-01 \
            --orders 30 \
            --seed 42

      - name: Test dbt connection
        working-directory: dbt/ecommerce_dw
        run: dbt debug --profiles-dir . --target dev

      - name: Build and test dbt project
        working-directory: dbt/ecommerce_dw
        run: dbt build --profiles-dir . --target dev

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts
          path: |
            dbt/ecommerce_dw/target/
            dbt/ecommerce_dw/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs postgres airflow-db airflow-init airflow-api-server metabase

      - name: Stop containers
        if: always()
        run: docker compose down -v