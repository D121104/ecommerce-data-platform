name: ecommerce-data-platform

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.0}

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER}:${AIRFLOW_METADATA_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_METADATA_DB_NAME}

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:-airflow}:ADMIN
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW_PROJECT_ROOT: /opt/airflow/project
    AIRFLOW_ORDERS_PER_RUN: ${AIRFLOW_ORDERS_PER_RUN:-30}
    AIRFLOW_ORDER_SEED: ${AIRFLOW_ORDER_SEED:-42}

    INGESTION_DB_USER: ${INGESTION_DB_USER}
    INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    INGESTION_DB_HOST: postgres
    INGESTION_DB_PORT: "5432"
    INGESTION_DB_NAME: ${POSTGRES_DB}
    INGESTION_DB_CONNECT_TIMEOUT_SECONDS: ${INGESTION_DB_CONNECT_TIMEOUT_SECONDS:-10}

    DBT_TARGET: ${DBT_TARGET:-dev}
    DBT_HOST: postgres
    DBT_PORT: "5432"
    DBT_USER: ${DBT_DB_USER}
    DBT_PASSWORD: ${DBT_DB_PASSWORD}
    DBT_DBNAME: ${POSTGRES_DB}
    DBT_SCHEMA: ${DBT_SCHEMA:-dbt_dev}
    DBT_SSLMODE: disable
    DBT_LOG_PATH: /opt/airflow/logs/dbt
    DBT_TARGET_PATH: /tmp/dbt-target

    PLATZI_API_BASE_URL: ${PLATZI_API_BASE_URL}
    PLATZI_API_PAGE_SIZE: ${PLATZI_API_PAGE_SIZE:-50}
    PLATZI_API_MAX_PAGES: ${PLATZI_API_MAX_PAGES:-100}
    PLATZI_API_CONNECT_TIMEOUT_SECONDS: ${PLATZI_API_CONNECT_TIMEOUT_SECONDS:-5}
    PLATZI_API_READ_TIMEOUT_SECONDS: ${PLATZI_API_READ_TIMEOUT_SECONDS:-30}
    PLATZI_API_WRITE_TIMEOUT_SECONDS: ${PLATZI_API_WRITE_TIMEOUT_SECONDS:-10}
    PLATZI_API_POOL_TIMEOUT_SECONDS: ${PLATZI_API_POOL_TIMEOUT_SECONDS:-5}
    PLATZI_API_MAX_ATTEMPTS: ${PLATZI_API_MAX_ATTEMPTS:-4}
    PLATZI_API_BACKOFF_SECONDS: ${PLATZI_API_BACKOFF_SECONDS:-1}

    ALERT_WEBHOOK_KIND: ${ALERT_WEBHOOK_KIND:-slack}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

    MONITOR_STALE_AFTER_HOURS: ${MONITOR_STALE_AFTER_HOURS:-26}
    MONITOR_RUNNING_TIMEOUT_MINUTES: ${MONITOR_RUNNING_TIMEOUT_MINUTES:-120}
    MONITOR_EXPECTED_RUN_HOUR_UTC: ${MONITOR_EXPECTED_RUN_HOUR_UTC:-2}
    MONITOR_EXPECTED_RUN_GRACE_MINUTES: ${MONITOR_EXPECTED_RUN_GRACE_MINUTES:-60}

  user: "${AIRFLOW_UID:-50000}:0"

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/project/dbt:ro
    - airflow_auth:/opt/airflow/auth

  networks:
    - data_network


services:
  postgres:
    image: postgres:17-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}

      INGESTION_DB_USER: ${INGESTION_DB_USER}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}

      DBT_DB_USER: ${DBT_DB_USER}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}

      BI_DB_USER: ${BI_DB_USER}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}

      METABASE_APP_DB_NAME: ${METABASE_APP_DB_NAME}
      METABASE_APP_DB_USER: ${METABASE_APP_DB_USER}
      METABASE_APP_DB_PASSWORD: ${METABASE_APP_DB_PASSWORD}

      TZ: UTC
      PGTZ: UTC

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    shm_size: 128mb

    networks:
      - data_network


  airflow-db:
    image: postgres:17-bookworm

    environment:
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_METADATA_DB_USER} -d ${AIRFLOW_METADATA_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - data_network


  airflow-init:
    <<: *airflow-common
    user: "0:0"
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/auth
        python -c 'import json, os; from pathlib import Path; Path("/opt/airflow/auth/simple_auth_manager_passwords.json").write_text(json.dumps({os.environ["AIRFLOW_ADMIN_USERNAME"]: os.environ["AIRFLOW_ADMIN_PASSWORD"]}) + "\n")'
        chown "$${AIRFLOW_UID}:0" /opt/airflow/auth/simple_auth_manager_passwords.json
        chmod 640 /opt/airflow/auth/simple_auth_manager_passwords.json
        exec airflow version

    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}

    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy

    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    command: api-server

    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-api-server:
        condition: service_healthy

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.58.23

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${METABASE_APP_DB_USER}
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: UTC

    networks:
      - data_network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail -I http://localhost:3000/api/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
  airflow_auth:


networks:
  data_network:
    driver: bridge